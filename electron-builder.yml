appId: br.com.delivai.delidesk
productName: DeliDesk
copyright: Copyright © DelivAI
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
asar: true
extraMetadata:
  main: out/main/index.js
# Canal gerado por scripts/bake-channel.mjs (não versionar channel.json)
extraResources:
  - from: resources/channel.json
    to: channel.json
  - from: resources/icon.png
    to: icon.png
  - from: resources/install-virtual-printer.ps1
    to: install-virtual-printer.ps1
  - from: resources/uninstall-virtual-printer.ps1
    to: uninstall-virtual-printer.ps1
# Gera latest.yml + blockmap localmente (upload = CI). URL real vem do channel.json / backend.
publish:
  provider: generic
  url: https://updates.delivai.local/delidesk/${env.CHANNEL}/
win:
  icon: icon.png
  target:
    - target: nsis
      arch:
        - x64
  # CHANNEL=sandbox|prod (exportado pelo script / CI)
  artifactName: DeliDesk-Setup-${env.CHANNEL}-${version}.${ext}
  # Assinatura de código = fora de escopo V1
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DeliDesk
  include: build/installer.nsh
  # Upgrade in-place (não apaga pin da barra sem necessidade)
  deleteAppDataOnUninstall: false
  # Admin ajuda a criar a fila Spooler DeliDesk no pós-install
  allowElevation: true
linux:
  target:
    - dir
  category: Office
